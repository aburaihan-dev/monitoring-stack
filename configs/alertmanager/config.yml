global:
  resolve_timeout: 5m
  smtp_require_tls: false

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  group_by: ["alertname", "cluster", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: "default"
      repeat_interval: 6h

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://uar:8080/api/v1/alerts"
        send_resolved: true

  - name: "critical"
    webhook_configs:
      - url: "http://uar:8080/api/v1/alerts"
        send_resolved: true
    # Uncomment and configure for Slack:
    # slack_configs:
    #   - api_url: "${SLACK_WEBHOOK_URL}"
    #     channel: "${SLACK_CHANNEL}"
    #     title: "[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}"
    #     text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
    #     send_resolved: true
    # Uncomment and configure for Email:
    # email_configs:
    #   - to: "${ALERT_EMAIL_TO}"
    #     from: "${ALERT_EMAIL_FROM}"
    #     smarthost: "${SMTP_HOST}"
    #     auth_username: "${SMTP_USERNAME}"
    #     auth_password: "${SMTP_PASSWORD}"

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "cluster", "service"]
