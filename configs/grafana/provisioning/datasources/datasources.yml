apiVersion: 1

datasources:
  # ── Mimir (metrics) ───────────────────────────────────────────────────────
  - name: Mimir
    uid: mimir
    type: prometheus
    url: http://mimir:9009/prometheus
    access: proxy
    isDefault: true
    jsonData:
      httpMethod: POST
      prometheusType: Mimir
      prometheusVersion: "3.0.0"
      queryTimeout: "60s"
      timeInterval: "15s"

  # ── Loki (logs) ───────────────────────────────────────────────────────────
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    access: proxy
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"traceID":"(\w+)"'
          name: TraceID
          url: "${__value.raw}"
          urlDisplayLabel: "Open in Tempo"

  # ── Tempo (traces) ────────────────────────────────────────────────────────
  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    access: proxy
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{job="$${__span.tags.service.name}"} |= "$${__span.traceId}"'
      tracesToMetrics:
        datasourceUid: mimir
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        queries:
          - name: Request rate
            query: rate(traces_spanmetrics_calls_total{$$__tags}[5m])
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki

  # ── Alertmanager ──────────────────────────────────────────────────────────
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    url: http://alertmanager:9093
    access: proxy
    jsonData:
      implementation: prometheus
