groups:
  - name: node.rules
    interval: 1m
    rules:

      # ── Recording Rules ──────────────────────────────────────────────────
      - record: job:node_cpu_utilisation:rate5m
        expr: >
          1 - avg without(cpu, mode)(
            rate(node_cpu_seconds_total{mode="idle"}[5m])
          )

      - record: job:node_memory_utilisation:ratio
        expr: >
          1 - (
            node_memory_MemAvailable_bytes /
            node_memory_MemTotal_bytes
          )

      - record: job:node_filesystem_utilisation:ratio
        expr: >
          1 - (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}
          )

      # ── Alerting Rules ───────────────────────────────────────────────────
      - alert: NodeHighCPU
        expr: job:node_cpu_utilisation:rate5m > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
          description: "CPU utilisation is {{ $value | humanizePercentage }} (threshold: 85%)."

      - alert: NodeCriticalCPU
        expr: job:node_cpu_utilisation:rate5m > 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical CPU on {{ $labels.instance }}"
          description: "CPU utilisation is {{ $value | humanizePercentage }} (threshold: 95%)."

      - alert: NodeHighMemory
        expr: job:node_memory_utilisation:ratio > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory on {{ $labels.instance }}"
          description: "Memory utilisation is {{ $value | humanizePercentage }} (threshold: 85%)."

      - alert: NodeCriticalMemory
        expr: job:node_memory_utilisation:ratio > 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical memory on {{ $labels.instance }}"
          description: "Memory utilisation is {{ $value | humanizePercentage }} (threshold: 95%)."

      - alert: NodeDiskRunningFull
        expr: job:node_filesystem_utilisation:ratio > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk filling up on {{ $labels.instance }}"
          description: "Filesystem {{ $labels.device }} is {{ $value | humanizePercentage }} full."

      - alert: NodeDiskCritical
        expr: job:node_filesystem_utilisation:ratio > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk critically full on {{ $labels.instance }}"
          description: "Filesystem {{ $labels.device }} is {{ $value | humanizePercentage }} full."

      - alert: NodeDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node exporter down — {{ $labels.instance }}"
          description: "node-exporter has been unreachable for more than 1 minute."
