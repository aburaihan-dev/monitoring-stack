x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "3"
    tag: "{{.Name}}"

x-monitoring-labels:
  &monitoring-labels
  logging: "alloy"
  logging_jobname: "containerlogs"

services:

  # ── Visualization ────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.1.0}
    container_name: grafana
    restart: unless-stopped
    user: "0"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_DATE_FORMATS_DEFAULT_TIMEZONE=Asia/Dhaka
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=warn
      - GF_PANELS_ENABLE_ALPHA=true
    volumes:
      - ./configs/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./configs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring
    mem_limit: 512m
    mem_reservation: 256m
    labels: *monitoring-labels
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Collection ───────────────────────────────────────────────────────────
  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.17.1}
    container_name: alloy
    restart: unless-stopped
    user: "0"
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    environment:
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
      - OBJECT_STORAGE_ENDPOINT=${OBJECT_STORAGE_ENDPOINT}
    volumes:
      - ./configs/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - /var/log/journal:/var/log/journal:ro
    ports:
      - "12345:12345"  # Alloy UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "3500:3500"    # Loki push
    depends_on:
      mimir:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - monitoring
    mem_limit: 512m
    mem_reservation: 256m
    labels: *monitoring-labels
    logging: *default-logging

  # ── Storage — Metrics ────────────────────────────────────────────────────
  mimir:
    image: grafana/mimir:${MIMIR_VERSION:-3.1.2}
    container_name: mimir
    restart: unless-stopped
    user: "0"
    command:
      - -config.file=/etc/mimir/config.yml
      - -config.expand-env=true
      - -server.http-listen-port=9009
    environment:
      - OBJECT_STORAGE_ENDPOINT
      - OBJECT_STORAGE_ACCESS_KEY_ID
      - OBJECT_STORAGE_SECRET_ACCESS_KEY
      - OBJECT_STORAGE_REGION
      - MIMIR_RETENTION_PERIOD
    volumes:
      - ./configs/mimir/config.yml:/etc/mimir/config.yml:ro
      - ./configs/rules:/rules/anonymous:ro
      - mimir-data:/data/mimir
    expose:
      - "9009"
    depends_on:
      storage-init:
        condition: service_completed_successfully
    networks:
      - monitoring
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 1g
    mem_reservation: 512m
    labels: *monitoring-labels
    logging: *default-logging

  # ── Storage — Logs ───────────────────────────────────────────────────────
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.3}
    container_name: loki
    restart: unless-stopped
    user: "0"
    command:
      - -config.file=/etc/loki/config.yml
      - -config.expand-env=true
    environment:
      - OBJECT_STORAGE_ENDPOINT
      - OBJECT_STORAGE_ACCESS_KEY_ID
      - OBJECT_STORAGE_SECRET_ACCESS_KEY
      - OBJECT_STORAGE_REGION
      - LOKI_RETENTION_PERIOD
    volumes:
      - ./configs/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    expose:
      - "3100"
    depends_on:
      storage-init:
        condition: service_completed_successfully
    networks:
      - monitoring
    mem_limit: 1g
    mem_reservation: 512m
    labels: *monitoring-labels
    logging: *default-logging

  # ── Storage — Traces ─────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-3.0.2}
    container_name: tempo
    restart: unless-stopped
    user: "0"
    command:
      - -config.file=/etc/tempo/config.yml
      - -config.expand-env=true
    environment:
      - OBJECT_STORAGE_ENDPOINT
      - OBJECT_STORAGE_ACCESS_KEY_ID
      - OBJECT_STORAGE_SECRET_ACCESS_KEY
      - OBJECT_STORAGE_REGION
      - TEMPO_RETENTION_PERIOD
    volumes:
      - ./configs/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    expose:
      - "3200"   # Tempo HTTP API (queried by Grafana internally)
      - "4317"   # OTLP gRPC receiver (from Alloy internally)
    depends_on:
      storage-init:
        condition: service_completed_successfully
    networks:
      - monitoring
    mem_limit: 1g
    mem_reservation: 512m
    labels: *monitoring-labels
    logging: *default-logging

  # ── Alerting ─────────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-v0.33.1}
    container_name: alertmanager
    restart: unless-stopped
    user: "0"
    command:
      - --config.file=/etc/alertmanager/config.yml
      - --log.level=warn
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
    volumes:
      - ./configs/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - monitoring
    mem_limit: 256m
    mem_reservation: 128m
    labels: *monitoring-labels
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  uar:
    image: ghcr.io/jamesread/uncomplicated-alert-receiver:latest
    container_name: uar
    restart: unless-stopped
    user: "0"
    expose:
      - "8080"
    networks:
      - monitoring
    mem_limit: 64m
    mem_reservation: 32m
    labels: *monitoring-labels
    logging: *default-logging

  # ── Sources ──────────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.12.1}
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose:
      - "9100"
    networks:
      - monitoring
    mem_limit: 128m
    mem_reservation: 32m
    labels: *monitoring-labels
    logging: *default-logging

  cadvisor:
    image: ghcr.io/google/cadvisor:${CADVISOR_VERSION:-0.60.5}
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    entrypoint: ["/usr/bin/cadvisor"]
    command: ["-logtostderr"]
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "8080"
    networks:
      - monitoring
    mem_limit: 256m
    mem_reservation: 128m
    labels: *monitoring-labels
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/usr/bin/cadvisor", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  blackbox-exporter:
    image: prom/blackbox-exporter:${BLACKBOX_VERSION:-v0.28.0}
    container_name: blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/config.yml
    volumes:
      - ./configs/blackbox/config.yml:/etc/blackbox/config.yml:ro
    expose:
      - "9115"
    networks:
      - monitoring
    mem_limit: 64m
    mem_reservation: 32m
    labels: *monitoring-labels
    logging: *default-logging

  # ── Infrastructure — Object Storage (choose ONE via ./stack storage <mode>) ─
  garage:
    image: dxflrs/garage:${GARAGE_VERSION:-v2.3.0}
    container_name: garage
    restart: unless-stopped
    profiles: ["garage"]
    entrypoint: ["/garage"]
    command: ["-c", "/etc/garage/garage.toml", "server"]
    volumes:
      - ./configs/garage/garage.toml:/etc/garage/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    expose:
      - "3900"   # S3 API (internal — used by Loki, Tempo, Mimir)
      - "3901"   # RPC (internal)
      - "3902"   # S3 website hosting (internal)
      - "3903"   # Admin API + metrics (internal)
    networks:
      - monitoring
    mem_limit: 256m
    mem_reservation: 64m
    labels: *monitoring-labels
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/garage", "--version"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.39}
    container_name: seaweedfs
    restart: unless-stopped
    profiles: ["seaweedfs"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "weed server -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024 -volume.preStopSeconds=1 -master.raftHashicorp=false -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip=seaweedfs"
    volumes:
      - ./configs/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data
    ports:
      - "127.0.0.1:8888:8888"   # SeaweedFS filer UI / admin API
      - "127.0.0.1:9333:9333"   # SeaweedFS master UI / cluster status
      - "127.0.0.1:${SEAWEEDFS_VOLUME_UI_PORT:-18080}:8080"   # SeaweedFS volume server UI / node status
    expose:
      - "8333"   # S3 API (internal — used by Loki, Tempo, Mimir)
      - "8888"   # Filer HTTP (internal — used by storage-init to create buckets)
      - "9333"   # Master (internal)
    networks:
      - monitoring
    mem_limit: 512m
    mem_reservation: 128m
    labels: *monitoring-labels
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/buckets/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # storage-init has no profile (always defined) so Mimir/Loki/Tempo can
  # always depend on it — it polls whichever backend OBJECT_STORAGE selects
  # rather than relying on a profile-gated compose dependency.
  storage-init:
    image: python:3-alpine
    container_name: storage-init
    restart: "no"
    command: ["python3", "/scripts/storage-init.py"]
    environment:
      - OBJECT_STORAGE=${OBJECT_STORAGE:-garage}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
      - GARAGE_ACCESS_KEY_ID=${GARAGE_ACCESS_KEY_ID}
      - GARAGE_SECRET_ACCESS_KEY=${GARAGE_SECRET_ACCESS_KEY}
      - GARAGE_CAPACITY_GB=${GARAGE_CAPACITY_GB:-100}
    volumes:
      - ./scripts/storage-init.py:/scripts/storage-init.py:ro
    networks:
      - monitoring

  valkey:
    image: valkey/valkey:${VALKEY_VERSION:-9.1.0-alpine3.23}
    container_name: valkey
    restart: unless-stopped
    user: "0"
    command: valkey-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - valkey-data:/data
    networks:
      - monitoring
    mem_limit: 256m
    mem_reservation: 64m
    labels: *monitoring-labels
    logging: *default-logging

  # ── Reverse Proxy (optional) ─────────────────────────────────────────────
  # Only starts when PROXY_MODE is "http" or "ssl" (./stack proxy <mode>),
  # via the "proxy" compose profile. Fronts Grafana only.
  nginx:
    image: nginx:${NGINX_VERSION:-1.29-alpine}
    container_name: nginx
    restart: unless-stopped
    profiles: ["proxy"]
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./configs/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    depends_on:
      - grafana
    networks:
      - monitoring
    mem_limit: 64m
    mem_reservation: 16m
    labels: *monitoring-labels
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  grafana-data: {}
  alloy-data: {}
  loki-data: {}
  tempo-data: {}
  mimir-data: {}
  alertmanager-data: {}
  garage-meta: {}
  garage-data: {}
  seaweedfs-data: {}
  redis-data: {}
  valkey-data: {}

networks:
  monitoring:
    name: monitoring
    driver: bridge
