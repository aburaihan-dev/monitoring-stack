x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "3"
    tag: "{{.Name}}"

x-monitoring-labels:
  &monitoring-labels
  logging: "alloy"
  logging_jobname: "containerlogs"

services:

  # ── Reverse Proxy ────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.30-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/templates:/etc/nginx/templates:ro
      - ./configs/nginx/snippets:/etc/nginx/snippets:ro
      - ./configs/nginx/ssl:/etc/nginx/ssl:ro
      - ./configs/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - nginx-logs:/var/log/nginx
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN:-monitoring.local}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/conf.d
    depends_on:
      - grafana
      - alertmanager
      - uar
      - alloy
    networks:
      - monitoring
    mem_limit: 256m
    mem_reservation: 64m
    labels: *monitoring-labels
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Visualization ────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.0.1}
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://grafana.${BASE_DOMAIN:-monitoring.local}
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=warn
      - GF_PANELS_ENABLE_ALPHA=true
    volumes:
      - ./configs/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./configs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    networks:
      - monitoring
    mem_limit: 512m
    mem_reservation: 256m
    labels: *monitoring-labels
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Collection ───────────────────────────────────────────────────────────
  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.16.1}
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    environment:
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./configs/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    expose:
      - "12345"   # Alloy UI / self-metrics
      - "4317"    # OTLP gRPC  (internal Docker network only)
      - "4318"    # OTLP HTTP  (proxied by nginx via ingest.DOMAIN)
      - "3500"    # Loki push  (proxied by nginx via ingest.DOMAIN)
      - "9090"    # Prom remote_write (proxied by nginx via ingest.DOMAIN)
    depends_on:
      mimir:
        condition: service_started
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks:
      - monitoring
    mem_limit: 512m
    mem_reservation: 256m
    labels: *monitoring-labels
    logging: *default-logging

  # ── Storage — Metrics ────────────────────────────────────────────────────
  mimir:
    image: grafana/mimir:${MIMIR_VERSION:-3.0.6}
    container_name: mimir
    restart: unless-stopped
    command:
      - -config.file=/etc/mimir/config.yml
      - -config.expand-env=true
      - -server.http-listen-port=9009
    environment:
      - GARAGE_ACCESS_KEY_ID
      - GARAGE_SECRET_ACCESS_KEY
      - MIMIR_RETENTION_PERIOD
    volumes:
      - ./configs/mimir/config.yml:/etc/mimir/config.yml:ro
      - ./configs/rules:/rules/anonymous:ro
      - mimir-data:/data/mimir
    expose:
      - "9009"
    depends_on:
      garage-init:
        condition: service_completed_successfully
    networks:
      - monitoring
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 1g
    mem_reservation: 512m
    labels: *monitoring-labels
    logging: *default-logging

  # ── Storage — Logs ───────────────────────────────────────────────────────
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.1}
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
      - -config.expand-env=true
    environment:
      - GARAGE_ACCESS_KEY_ID
      - GARAGE_SECRET_ACCESS_KEY
      - LOKI_RETENTION_PERIOD
    volumes:
      - ./configs/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    expose:
      - "3100"
    depends_on:
      garage-init:
        condition: service_completed_successfully
    networks:
      - monitoring
    mem_limit: 1g
    mem_reservation: 512m
    labels: *monitoring-labels
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Storage — Traces ─────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.10.5}
    container_name: tempo
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo/config.yml
      - -config.expand-env=true
    environment:
      - GARAGE_ACCESS_KEY_ID
      - GARAGE_SECRET_ACCESS_KEY
      - TEMPO_RETENTION_PERIOD
    volumes:
      - ./configs/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    expose:
      - "3200"   # Tempo HTTP API (queried by Grafana internally)
      - "4317"   # OTLP gRPC receiver (from Alloy internally)
    depends_on:
      garage-init:
        condition: service_completed_successfully
    networks:
      - monitoring
    mem_limit: 1g
    mem_reservation: 512m
    labels: *monitoring-labels
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Alerting ─────────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-v0.32.1}
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/config.yml
      - --log.level=warn
      - --storage.path=/alertmanager
      - --web.external-url=https://alertmanager.${BASE_DOMAIN:-monitoring.local}
    volumes:
      - ./configs/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    expose:
      - "9093"
    networks:
      - monitoring
    mem_limit: 256m
    mem_reservation: 128m
    labels: *monitoring-labels
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  uar:
    image: ghcr.io/jamesread/uncomplicated-alert-receiver:latest
    container_name: uar
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - monitoring
    mem_limit: 64m
    mem_reservation: 32m
    labels: *monitoring-labels
    logging: *default-logging

  # ── Sources ──────────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.11.1}
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose:
      - "9100"
    networks:
      - monitoring
    mem_limit: 128m
    mem_reservation: 32m
    labels: *monitoring-labels
    logging: *default-logging

  cadvisor:
    image: ghcr.io/google/cadvisor:${CADVISOR_VERSION:-0.56.2}
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    entrypoint: ["/usr/bin/cadvisor"]
    command: ["-logtostderr"]
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "8080"
    networks:
      - monitoring
    mem_limit: 256m
    mem_reservation: 128m
    labels: *monitoring-labels
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/usr/bin/cadvisor", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  blackbox-exporter:
    image: prom/blackbox-exporter:${BLACKBOX_VERSION:-v0.28.0}
    container_name: blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/config.yml
    volumes:
      - ./configs/blackbox/config.yml:/etc/blackbox/config.yml:ro
    expose:
      - "9115"
    networks:
      - monitoring
    mem_limit: 64m
    mem_reservation: 32m
    labels: *monitoring-labels
    logging: *default-logging

  # ── Infrastructure ───────────────────────────────────────────────────────
  garage:
    image: dxflrs/garage:${GARAGE_VERSION:-v2.3.0}
    container_name: garage
    restart: unless-stopped
    entrypoint: ["/garage"]
    command: ["-c", "/etc/garage/garage.toml", "server"]
    volumes:
      - ./configs/garage/garage.toml:/etc/garage/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    expose:
      - "3900"   # S3 API (internal — used by Loki, Tempo, Mimir)
      - "3901"   # RPC (internal)
      - "3902"   # S3 website hosting (internal)
      - "3903"   # Admin API + metrics (internal)
    networks:
      - monitoring
    mem_limit: 256m
    mem_reservation: 64m
    labels: *monitoring-labels
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/garage", "--version"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  garage-init:
    image: python:3-alpine
    container_name: garage-init
    restart: "no"
    depends_on:
      garage:
        condition: service_healthy
    command: ["python3", "/scripts/garage-init.py"]
    environment:
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
      - GARAGE_ACCESS_KEY_ID=${GARAGE_ACCESS_KEY_ID}
      - GARAGE_SECRET_ACCESS_KEY=${GARAGE_SECRET_ACCESS_KEY}
      - GARAGE_CAPACITY_GB=${GARAGE_CAPACITY_GB:-100}
    volumes:
      - ./scripts/garage-init.py:/scripts/garage-init.py:ro
    networks:
      - monitoring

  redis:
    image: redis:${REDIS_VERSION:-8-alpine}
    container_name: redis
    restart: unless-stopped
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - monitoring
    mem_limit: 256m
    mem_reservation: 64m
    labels: *monitoring-labels
    logging: *default-logging

volumes:
  grafana-data: {}
  alloy-data: {}
  loki-data: {}
  tempo-data: {}
  mimir-data: {}
  alertmanager-data: {}
  garage-meta: {}
  garage-data: {}
  redis-data: {}
  nginx-logs: {}

networks:
  monitoring:
    name: monitoring
    driver: bridge
